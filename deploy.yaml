services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: always
    volumes:
      - /volume1/docker/linkwarden/pgdata:/var/lib/postgresql/data
  linkwarden:
    env_file: .env
    environment:
      - DATABASE_URL=postgres://linkwardenuser:linkwardenpass@linkwarden-deploy-postgres-1:5432/linkwarden
    restart: always
    image: ghcr.io/linkwarden/linkwarden:latest
    ports:
      - 3101:3000
    volumes:
      - /volume1/docker/linkwarden/data:/data/data
    depends_on:
      - postgres
      - meilisearch
    OPENROUTER_API_KEY: ${openrouter}
  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    env_file:
      - .env
    volumes:
      - /volume1/docker/linkwarden/meili_data:/meili_data
